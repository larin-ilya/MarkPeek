name: Linux build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file desktop-file-utils \
            libgtk-3-dev libwebkit2gtk-4.0-dev
          pkg-config --modversion gtk+-3.0 webkit2gtk-4.0

      - name: Regenerate shared assets from Windows sources
        run: |
          python3 tools/gen_shared_assets.py
          git diff --exit-code src/shared || {
            echo "::error::src/shared is stale — run tools/gen_shared_assets.py and commit"
            exit 1
          }

      - name: Build
        run: |
          make -j"$(nproc)"
          file dist/markpeek
          ldd dist/markpeek | head -30

      - name: Smoke test (offscreen render + DOM/JS roundtrip)
        run: |
          sudo apt-get install -y --no-install-recommends xvfb
          xvfb-run -a -s "-screen 0 1280x800x24" ./ci/smoke_test.sh dist/markpeek

      - name: Validate desktop entry
        run: |
          desktop-file-validate assets/markpeek.desktop

      - name: Package tarball
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="markpeek-${TAG}-linux-x86_64"
          mkdir -p "pack/${PKG}"
          cp dist/markpeek "pack/${PKG}/"
          cp README.md LICENSE "pack/${PKG}/"
          cp assets/markpeek.desktop "pack/${PKG}/"
          cp assets/icon.png "pack/${PKG}/markpeek.png"
          cat > "pack/${PKG}/INSTALL.txt" <<'EOF'
          MarkPeek (Linux) — portable build
          ---------------------------------
          1) tar xf markpeek-*.tar.gz
          2) ./markpeek-*/markpeek [file.md]

          Dependencies: GTK 3 and WebKit2GTK.
          Debian/Ubuntu:  sudo apt install libgtk-3-0 libwebkit2gtk-4.0-37
          Fedora:         sudo dnf install gtk3 webkit2gtk4.0
          Arch:           sudo pacman -S gtk3 webkit2gtk-4.1

          System install:
            sudo cp markpeek /usr/local/bin/
            sudo cp markpeek.desktop /usr/local/share/applications/
            sudo cp markpeek.png /usr/local/share/icons/hicolor/256x256/apps/markpeek.png
          EOF
          tar -czf "dist/${PKG}.tar.gz" -C pack "${PKG}"
          sha256sum "dist/${PKG}.tar.gz" > "dist/${PKG}.tar.gz.sha256"
          echo "TARBALL=dist/${PKG}.tar.gz" >> "$GITHUB_ENV"
          echo "TARBALL_SUM=dist/${PKG}.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Build AppImage
        run: |
          TAG="${GITHUB_REF_NAME}"
          curl -sSfL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/markpeek AppDir/usr/bin/
          cp assets/markpeek.desktop AppDir/usr/share/applications/markpeek.desktop
          cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/markpeek.png
          ./linuxdeploy --appdir AppDir --output appimage \
            -e dist/markpeek \
            -i assets/icon.png \
            -d assets/markpeek.desktop
          APPIMG="MarkPeek-${TAG}-x86_64.AppImage"
          mv MarkPeek-*.AppImage "dist/${APPIMG}"
          chmod +x "dist/${APPIMG}"
          sha256sum "dist/${APPIMG}" > "dist/${APPIMG}.sha256"
          echo "APPIMAGE=dist/${APPIMG}" >> "$GITHUB_ENV"
          echo "APPIMAGE_SUM=dist/${APPIMG}.sha256" >> "$GITHUB_ENV"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: markpeek-linux-x86_64
          path: |
            dist/markpeek
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.AppImage
            dist/*.AppImage.sha256
          if-no-files-found: error

      - name: Attach release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.AppImage
            dist/*.AppImage.sha256
